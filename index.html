<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<body>
<title>LVL UP Croissance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap">
<style>
@property --a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

/* Layout : une colonne de téléphone, une chambre la nuit éclairée par un ruban LED ; le ruban ne marque que l'action du moment. */
:root {
  --bg: #100D1F;
  --bg-2: #16122B;
  --surface: #1C1733;
  --surface-2: #262042;
  --surface-3: #332B57;
  --line: rgba(206, 196, 255, .10);
  --line-2: rgba(206, 196, 255, .20);
  --text: #F4F1FF;
  --muted: #ABA4CC;
  --dim: #7A7399;
  --ink: #120E22;
  --pink: #FF4FC1;   --pink-s: rgba(255, 79, 193, .18);
  --cyan: #3BE3FF;   --cyan-s: rgba(59, 227, 255, .16);
  --lime: #B8FF4F;   --lime-s: rgba(184, 255, 79, .15);
  --amber: #FFB84D;  --amber-s: rgba(255, 184, 77, .17);
  --violet: #9D7BFF; --violet-s: rgba(157, 123, 255, .2);
  --coral: #FF7A59;  --coral-s: rgba(255, 122, 89, .18);
  --good: #5CF0A2;
  --bad: #FF6B81;
  --glass: rgba(28, 23, 51, .74);
  --scrim: rgba(6, 4, 14, .62);
  --led: linear-gradient(90deg, var(--pink), var(--violet) 35%, var(--cyan) 70%, var(--lime));
  --font-display: "Unbounded", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  --r-xl: 28px; --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
  --spring: cubic-bezier(.2, 1.3, .35, 1);
  --ease: cubic-bezier(.22, .8, .2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body.lock { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* ambiance : lueurs LED qui dérivent */
.glow { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.glow i { position: absolute; width: 75vmax; height: 75vmax; border-radius: 50%; animation: drift 24s var(--ease) infinite alternate; }
.glow i:nth-child(1) { background: radial-gradient(closest-side, rgba(255, 79, 193, .22), transparent); top: -38vmax; left: -30vmax; }
.glow i:nth-child(2) { background: radial-gradient(closest-side, rgba(59, 227, 255, .14), transparent); top: 25vh; right: -42vmax; animation-delay: -8s; }
.glow i:nth-child(3) { background: radial-gradient(closest-side, rgba(157, 123, 255, .2), transparent); bottom: -42vmax; left: -18vmax; animation-delay: -15s; }
@keyframes drift { to { transform: translate3d(7vmax, 9vmax, 0) scale(1.12); } }

/* vue principale */
#view {
  position: relative; z-index: 1;
  max-width: 480px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(112px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
#view.enter > * { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 50ms); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
section { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sec-h h2 { font-size: 17px; }
.sec-h .aside { font-size: 13px; color: var(--muted); font-weight: 600; }
.page-h { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.page-h h1 { font-size: 27px; line-height: 1.1; }
.page-h p { color: var(--muted); font-size: 15px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }

/* boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 999px; font-weight: 700; font-size: 16px; transition: transform .18s var(--ease), opacity .2s; white-space: nowrap; }
.btn:active { transform: scale(.95); }
.btn .i { width: 20px; height: 20px; }
.btn-primary { background: var(--text); color: var(--ink); box-shadow: 0 8px 28px -6px rgba(255, 79, 193, .55), 0 4px 20px -8px rgba(59, 227, 255, .6); }
.btn-ghost { background: var(--surface-2); color: var(--text); }
.btn-quiet { background: transparent; color: var(--muted); }
.btn-danger { background: rgba(255, 107, 129, .14); color: var(--bad); }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.iconbtn { width: 42px; height: 42px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; transition: transform .18s var(--ease); }
.iconbtn:active { transform: scale(.9); }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-block: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; flex: none; transition: background .2s, color .2s; }
.chip.on { background: var(--text); color: var(--ink); }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--cs, var(--surface-2)); color: var(--c, var(--muted)); white-space: nowrap; }

/* en-tête accueil */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 4px; }
.top-tx { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.logo { font-family: var(--font-display); font-weight: 800; letter-spacing: .04em; background: var(--led); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hello { font-size: 27px; line-height: 1.1; }
.wave { display: inline-block; animation: wave 2.4s ease-in-out 1 .4s; transform-origin: 70% 80%; }
@keyframes wave { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(16deg); } 20%, 40% { transform: rotate(-8deg); } }
.avatar { width: 54px; height: 54px; border-radius: 50%; position: relative; display: grid; place-items: center; flex: none; background: var(--surface); }
.avatar svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.avatar span { font-family: var(--font-display); font-weight: 800; font-size: 18px; }
.avatar small { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 800; letter-spacing: .08em; background: var(--surface-3); padding: 1px 6px; border-radius: 99px; color: var(--muted); }
.bday { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--amber-s); color: var(--amber); font-size: 13px; font-weight: 700; margin-top: -10px; }

/* carte ruban LED */
.led { position: relative; isolation: isolate; border-radius: var(--r-xl); padding: 1.5px; }
.led::before, .led::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: conic-gradient(from var(--a), var(--pink), var(--violet), var(--cyan), var(--lime), var(--amber), var(--pink)); animation: ledspin 7s linear infinite; z-index: -1; }
.led::after { inset: 14px 10px -8px; filter: blur(26px); opacity: .45; z-index: -2; }
@keyframes ledspin { to { --a: 360deg; } }
.led-in { position: relative; border-radius: calc(var(--r-xl) - 1.5px); background: linear-gradient(165deg, var(--surface-2), var(--surface) 65%); padding: 20px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.hero-em { position: absolute; right: 14px; top: 12px; font-size: 54px; line-height: 1; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .4)); pointer-events: none; }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-4deg); } }
.hero-t { font-size: 24px; line-height: 1.12; padding-right: 64px; }
.led-in > .eyebrow { padding-right: 64px; }
.hero-meta { font-size: 14px; font-weight: 700; color: var(--c, var(--cyan)); }
.hero-p { color: var(--muted); font-size: 15px; }
.hero-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.hero-row .btn-primary { flex: 1; }

/* tuiles chiffres */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; transition: transform .18s var(--ease); }
.stat:active { transform: scale(.96); }
.stat .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--font-display); font-size: 19px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 11px; color: var(--muted); font-family: var(--font-body); font-weight: 700; margin-left: 2px; }
.stat .d { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.up { color: var(--good) !important; }
.dn { color: var(--amber) !important; }

/* XP */
.xp { display: flex; flex-direction: column; gap: 8px; }
.xp-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; }
.xp-row b { font-family: var(--font-display); font-size: 15px; }
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--led); background-size: 200% 100%; animation: shimmer 3s linear infinite; transition: width .8s var(--ease); }
@keyframes shimmer { to { background-position: -200% 0; } }

/* missions */
.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); text-align: left; transition: transform .18s var(--ease), background .25s; }
.row:active { transform: scale(.98); }
.row .ic { font-size: 22px; width: 30px; text-align: center; flex: none; }
.row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .tx b { font-size: 15px; font-weight: 700; }
.row .tx span { font-size: 13px; color: var(--muted); }
.row .end { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; flex: none; }
.check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; flex: none; transition: background .25s, border-color .25s; color: transparent; }
.check .i { width: 16px; height: 16px; stroke-width: 3; }
.row.done { background: rgba(92, 240, 162, .06); border-color: rgba(92, 240, 162, .22); }
.row.done .check { background: var(--good); border-color: var(--good); color: var(--ink); }
.row.done .tx b { color: var(--muted); }
.row.pop .check { animation: pop .5s var(--spring); }
@keyframes pop { 0% { transform: scale(.5); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.mini-ring { position: relative; width: 38px; height: 38px; flex: none; }
.mini-ring svg { transform: rotate(-90deg); }
.mini-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 800; }

/* eau */
.water { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 7px; }
.glass { aspect-ratio: 3 / 4.2; max-width: 100%; border-radius: 5px 5px 11px 11px; border: 2px solid var(--line-2); position: relative; overflow: hidden; transition: transform .2s var(--spring), border-color .3s; }
.glass:active { transform: scale(.88); }
.glass i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, var(--cyan), #2A8CFF); transition: height .55s var(--spring); }
.glass i::before { content: ""; position: absolute; left: -50%; top: -5px; width: 200%; height: 10px; border-radius: 45%; background: var(--cyan); animation: slosh 2.2s ease-in-out infinite alternate; opacity: 0; transition: opacity .3s; }
.glass.on i::before { opacity: 1; }
@keyframes slosh { from { transform: translateX(-10%) rotate(-3deg); } to { transform: translateX(10%) rotate(3deg); } }
.glass.on { border-color: rgba(59, 227, 255, .55); }
.glass.on i { height: 82%; }
.water-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }

.tip { display: flex; gap: 14px; align-items: flex-start; }
.tip .big { font-size: 30px; line-height: 1; flex: none; }
.tip b { display: block; font-size: 15px; margin-bottom: 3px; }
.tip p { font-size: 15px; color: var(--muted); }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); background: var(--amber-s); border: 1px solid rgba(255, 184, 77, .3); font-size: 14px; }
.alert b { color: var(--amber); display: block; margin-bottom: 2px; }

/* sport */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 0 9px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: var(--muted); position: relative; min-width: 0; }
.wd .e { font-size: 19px; line-height: 1.1; }
.wd.today { border-color: var(--text); color: var(--text); box-shadow: 0 0 0 1px var(--text) inset; }
.wd.done::after { content: ""; position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 8px var(--good); }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 15px; padding: 4px; position: relative; }
.seg button { height: 40px; border-radius: 11px; font-weight: 700; font-size: 14px; color: var(--muted); position: relative; z-index: 1; transition: color .25s; }
.seg button.on { color: var(--ink); }
.seg .knob { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 11px; background: var(--text); transition: transform .45s var(--spring); transform: translateX(calc(var(--k, 1) * 100%)); }
.seg-help { font-size: 13px; color: var(--muted); }
.prog { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; position: relative; overflow: hidden; transition: transform .18s var(--ease); }
.prog:active { transform: scale(.98); }
.prog::before { content: ""; position: absolute; left: -40px; top: -40px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(closest-side, var(--cs), transparent); pointer-events: none; }
.prog .em { position: relative; width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 28px; background: var(--cs); box-shadow: inset 0 0 0 1px var(--cs); flex: none; }
.prog .tx { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.prog .tx b { font-family: var(--font-display); font-size: 15.5px; font-weight: 700; }
.prog .tx span { font-size: 13px; color: var(--muted); }
.prog .go { color: var(--c); position: relative; }
.prog .tx .today-tag { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
details.rules { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 4px 16px; }
details.rules summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 0; cursor: pointer; }
details.rules summary::-webkit-details-marker { display: none; }
details.rules summary b { flex: 1; font-size: 15px; }
details.rules summary .i { transition: transform .3s var(--ease); color: var(--muted); }
details.rules[open] summary .i { transform: rotate(90deg); }
.rules-list { list-style: none; margin: 0; padding: 4px 0 16px; display: flex; flex-direction: column; gap: 12px; }
.rules-list li { display: flex; gap: 12px; font-size: 14.5px; color: var(--muted); }
.rules-list li span { font-size: 18px; flex: none; width: 24px; text-align: center; }
.rules-list li b { color: var(--text); }

/* repas */
.plate { display: flex; align-items: center; gap: 16px; }
.plate svg { width: 132px; height: 132px; flex: none; }
.plate-l { display: flex; flex-direction: column; gap: 7px; font-size: 14px; min-width: 0; }
.plate-l div { display: flex; align-items: center; gap: 8px; }
.plate-l i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.arc { fill: none; stroke-width: 15; animation: draw 1.1s var(--ease) both; }
@keyframes draw { from { stroke-dasharray: 0 300; } }
.prot-ex { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.allies { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; padding-bottom: 2px; }
.allies::-webkit-scrollbar { display: none; }
.ally { flex: 0 0 76%; max-width: 300px; scroll-snap-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
.ally .e { font-size: 30px; }
.ally b { font-family: var(--font-display); font-size: 16px; }
.ally p { font-size: 14px; }
.ally .f { color: var(--muted); font-size: 13px; }
.tl { display: flex; flex-direction: column; }
.tl-row { display: grid; grid-template-columns: 56px 14px minmax(0, 1fr); gap: 10px; }
.tl-time { font-size: 13px; font-weight: 700; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; padding-top: 1px; }
.tl-dot { position: relative; }
.tl-dot::before { content: ""; position: absolute; left: 2px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.tl-dot::after { content: ""; position: absolute; left: 6px; top: 19px; bottom: 2px; width: 2px; background: var(--line-2); }
.tl-row:last-child .tl-dot::after { display: none; }
.tl-tx { padding-bottom: 16px; display: flex; flex-direction: column; gap: 1px; }
.tl-tx b { font-size: 15px; }
.tl-tx span { font-size: 13.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rcp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-width: 0; transition: transform .18s var(--ease); }
.rcp:active { transform: scale(.96); }
.rcp .e { font-size: 34px; line-height: 1.1; }
.rcp b { font-size: 14.5px; line-height: 1.25; }
.rcp .meta { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: auto; }
.rcp .meta em { font-style: normal; color: var(--pink); }
.avoid { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.avoid li { display: flex; gap: 10px; font-size: 14.5px; color: var(--muted); }
.avoid li::before { content: "✕"; color: var(--bad); font-weight: 800; flex: none; }

/* jeux */
.game { aspect-ratio: 1 / 1.08; max-width: 100%; border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; background: linear-gradient(160deg, var(--cs), var(--surface) 72%); border: 1px solid var(--line); overflow: hidden; position: relative; transition: transform .18s var(--ease); }
.game:active { transform: scale(.96); }
.game .e { font-size: 44px; line-height: 1; animation: bob 3s ease-in-out infinite; animation-delay: var(--dl, 0s); }
.game b { font-family: var(--font-display); font-size: 15px; display: block; }
.game span { font-size: 12.5px; color: var(--muted); }
.game .rec { font-size: 12px; font-weight: 800; color: var(--c); }

/* barre d'onglets flottante */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 0 max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); pointer-events: none; }

.tab-pill::after { content: ""; position: absolute; left: 32%; right: 32%; bottom: 4px; height: 3px; border-radius: 3px; background: var(--led); box-shadow: 0 0 10px var(--pink); }

/* feuilles (bottom sheets) */
#sheet-root { position: fixed; inset: 0; z-index: 60; }
.scrim { position: absolute; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: 0; transition: opacity .3s; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 480px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 20px); overflow-y: auto; overscroll-behavior: contain; background: var(--bg-2); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 28px 28px 0 0; padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); transform: translateY(105%); transition: transform .46s cubic-bezier(.2, 1.05, .3, 1); display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -20px 60px rgba(0, 0, 0, .5); }

.delta { text-align: center; font-size: 14px; color: var(--muted); font-weight: 600; min-height: 20px; }
.ruler-wrap { display: flex; align-items: center; gap: 8px; }

.rsp { flex: 0 0 50%; }

.rtrack span { position: absolute; top: 42px; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 1px; }
.rneedle { position: absolute; left: 50%; top: -6px; width: 4px; height: 44px; margin-left: -1px; border-radius: 4px; background: linear-gradient(180deg, var(--pink), var(--cyan)); box-shadow: 0 0 12px var(--pink); pointer-events: none; }
.rbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.rbtn:active { transform: scale(.9); }
.howto { list-style: none; margin: 0; padding: 14px 16px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; font-size: 14px; color: var(--muted); }

.welcome-logo { font-family: var(--font-display); font-weight: 800; font-size: 40px; letter-spacing: .02em; text-align: center; background: var(--led); background-size: 200% 100%; animation: shimmer 4s linear infinite; -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: 4px; }

/* lecteur de séance */

.orb { width: min(48vw, 186px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, var(--surface-3), var(--surface) 72%); box-shadow: 0 0 0 1px var(--line-2), 0 0 70px -14px var(--c, var(--pink)); position: relative; }

@keyframes ripple { 0% { transform: scale(.9); opacity: .55; } 100% { transform: scale(1.25); opacity: 0; } }

.pl-name { font-size: 25px; text-align: center; line-height: 1.12; }

@keyframes tempo { 0%, 100% { left: 6px; } 40% { left: calc(100% - 24px); } }

.easy { font-size: 13.5px; color: var(--muted); padding: 10px 12px; border-radius: 12px; background: var(--surface); }

.fin { align-items: stretch; text-align: center; justify-content: center; gap: 16px; }

.fin-stats div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 6px; display: flex; flex-direction: column; gap: 2px; }

/* mini-jeux */

.wheel { width: 100%; height: 100%; transition: transform 4.4s cubic-bezier(.12, .72, .08, 1); filter: drop-shadow(0 12px 30px rgba(0, 0, 0, .5)); }

.result { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-lg); padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 10px; animation: lvpop .6s var(--spring) both; }

function defaultState() {

    profile: { name: '', birth: SEED.birth, lvl: 1, sound: true, start: t, par: { f: '', m: '', sex: '' } },

function migrate(o) {
  const d = defaultState();
  if (!o || typeof o !== 'object') return d;
  const out = Object.assign(d, o);
  out.profile = Object.assign(defaultState().profile, o.profile || {});
  out.profile.par = Object.assign({ f: '', m: '', sex: '' }, (o.profile && o.profile.par) || {});
  out.games = Object.assign(defaultState().games, o.games || {});
  if (!out.games.spins || typeof out.games.spins !== 'object') out.games.spins = {};
  out.asked = Object.assign({ w: '', h: '', b: '' }, o.asked || {});
  ['weights', 'heights', 'workouts'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  ['habits', 'water', 'badges', 'flags', 'days'].forEach(k => { if (!out[k] || typeof out[k] !== 'object') out[k] = {}; });
  return out;
}

const Sync = { ref: null, busy: false, dirty: false, retry: null };
let remoteTimer = null;
function persist() { S.updatedAt = Date.now(); saveLocal(); queueRemote(); }
function queueRemote() { if (!Sync.ref) return; Sync.dirty = true; clearTimeout(remoteTimer); remoteTimer = setTimeout(flushRemote, 900); }
async function flushRemote() {
  if (!Sync.ref || Sync.busy || !Sync.dirty) return;
  Sync.busy = true; Sync.dirty = false;
  try {
    await Sync.ref.set({ state: JSON.parse(JSON.stringify(S)), updatedAt: S.updatedAt });
  } catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' || code === 'resource_exhausted') { Sync.dirty = true; clearTimeout(Sync.retry); Sync.retry = setTimeout(flushRemote, 1500 + Math.random() * 2000); }
    else { Sync.ref = null; }
  } finally {
    Sync.busy = false;
    if (Sync.dirty && Sync.ref && !Sync.retry) queueRemote();
    Sync.retry = null;
  }
}

  if (!body || !body.state || (body.updatedAt || 0) <= (S.updatedAt || 0)) return false;
  S = migrate(JSON.parse(JSON.stringify(body.state)));

    const ref = db.doc('data/users/' + id + '/state');
    const snap = await ref.get();

function ageInfo(birthKey) {
  const b = parseKey(birthKey), t = parseKey(today());
  let age = t.getFullYear() - b.getFullYear();
  if (t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) age--;
  let next = new Date(t.getFullYear(), b.getMonth(), b.getDate());
  if (next < t) next = new Date(t.getFullYear() + 1, b.getMonth(), b.getDate());
  const daysTo = Math.round((next - t) / 864e5);
  return { age, daysTo, nextAge: daysTo === 0 ? age : age + 1 };
}

  if (m >= 420) return { col: 'amber', txt: 'Un peu court. Ce soir, vise un coucher plus tôt.' };
  return { col: 'coral', txt: 'Nuit trop courte 😴 Ce soir, couche-toi tôt : c’est la nuit que tu grandis.' };
}

// Premier créneau libre de `dur` minutes le plus proche de `pref`, entre lo et hi, hors des blocs occupés
function findSlot(dur, pref, lo, hi, blocks) {
  let best = null;
  for (let c = Math.ceil(lo / 15) * 15; c + dur <= hi; c += 15) {
    if (blocks.some(b => c < b[1] && c + dur > b[0])) continue;
    const sc = Math.abs(c - pref);
    if (best === null || sc < best.sc) best = { c, sc };
  }
  return best ? best.c : null;
}

// Calcule la journée : repas, séance, eau, écrans, coucher, autour des activités prévues
function planFor(key) {
  const D = S.days[key];
  if (!D) return null;
  const W = toMin(D.wake), N = isNaN(toMin(D.next)) ? W : toMin(D.next);
  if (isNaN(W)) return null;
  const slept = sleepMin(D);
  // au lit 9 h 15 avant le réveil de demain (9 h de sommeil + le temps de s'endormir), entre 20 h 30 et 22 h 45
  const bed = clamp(N + 1440 - 555, 1230, 1365);

  const busy = acts.filter(a => a.k !== 'food');
  const school = busy.find(a => a.k === 'school');
  const inBusy = (m, ks) => busy.find(b => m >= b.f && m < b.t && (!ks || ks.includes(b.k)));
  const foodOf = m => acts.find(a => a.k === 'food' && a.meal === m);
  const meals = D.meals || {};
  // heure à laquelle la journée a été préparée (0 si un autre jour) : rien n'est placé avant
  const at = D.at ? new Date(D.at) : null, pm = at && keyOf(at) === key ? at.getHours() * 60 + at.getMinutes() : 0;
  const items = [];
  const add = (t, e, n, s, col, o) => items.push(Object.assign({ t: Math.round(t), e, n, s, col, notify: true }, o));
  const mk = (t, e, n, s, col, o) => Object.assign({ t: Math.round(t), e, n, s, col, notify: true, kind: 'meal' }, o);
  const out = (f, label, col) => mk(f.f, placeEmoji(f.place), `${label} · ${(f.place || 'dehors').trim()}`, placeTip(f.place), col);
  const M = {};

  add(W, '☀️', 'Réveil', 'Ouvre les volets : la lumière du jour règle ton horloge interne', 'amber', { notify: false, kind: 'wake' });

  let f = foodOf('pdj');
  if (f) M.pdj = out(f, 'Petit-déj', 'amber');
  else {
    let bk = W + 20;
    const first = busy.filter(b => b.f > W).sort((a, b) => a.f - b.f)[0];
    if (first && bk > first.f - 20) bk = Math.max(W + 5, first.f - 25);
    M.pdj = mk(bk, '🍳', 'Petit-déjeuner', 'Céréales ou pain, un produit laitier, un fruit. Ne le saute jamais !', 'amber');
  }

  const fl = foodOf('dej');
  if (fl) M.dej = out(fl, 'Déjeuner', 'pink');
  else if (school && school.f <= 720 && school.t >= 780) M.dej = mk(720, '🍽️', 'Déjeuner à la cantine', placeTip('cantine'), 'pink', { notify: false });
  else {
    let lu = 750;
    const b = inBusy(lu);
    if (b && b.t <= 840) lu = b.t + 10;
    M.dej = mk(lu, '🍽️', 'Déjeuner', b && lu < b.t ? 'Pendant ta sortie : prends un vrai repas, pas juste des chips 🥪' : 'Féculents, protéines, légumes et un produit laitier', 'pink');
  }

  f = foodOf('gouter');
  if (f) M.gouter = out(f, 'Goûter', 'lime');
  else {
    let go = 990;
    if (school && school.t >= 930 && school.t <= 1080) go = school.t + 15;
    const away = inBusy(go, ['friends', 'club', 'other']);
    M.gouter = mk(go, '🍪', 'Goûter', away ? 'Emporte-le : un fruit et du pain avec du chocolat, ou une barre de céréales' : 'Le repas clé pour faire du muscle : pain, fromage ou beurre de cacahuète, lait, fruit', 'lime');
  }

  f = foodOf('diner');
  const fastLunch = (fl && FAST.test(fl.place || '')) || (meals.dej && meals.dej.s === 'out' && FAST.test(meals.dej.place || ''));
  if (f) M.diner = out(f, 'Dîner', 'coral');
  else {

    if (b && b.t + 15 <= bed - 60) di = b.t + 15;
    M.diner = mk(di, '🍝', 'Dîner', fastLunch ? 'Légumes, féculents, protéines et un fruit. Pas besoin de manger moins : ton corps grandit.' : 'Comme le déjeuner : féculents, protéines, légumes, laitage', 'coral');
  }

  // repas déjà pris (journée préparée l'après-midi) et rattrapage d'un repas sauté
  Object.keys(M).forEach(m => {
    const L = meals[m];
    if (!L || !L.s) return;
    Object.assign(M[m], L.s === 'skip'
      ? { e: '⚠️', n: `${MEALS[m][0]} sauté`, s: 'Ça arrive. Le prochain repas compte double : ton corps grandit et a besoin d’énergie.' }
      : { e: L.s === 'out' ? placeEmoji(L.place) : M[m].e, n: `${MEALS[m][0]} ✓`, s: mealLogTxt(m, L) },
    { notify: false, done: true });

  const skipped = m => meals[m] && meals[m].s === 'skip';
  if (skipped('pdj') && pm && pm < M.dej.t - 75) M.snack = mk(pm + 5, '🥐', 'Collation de rattrapage', 'Pas de petit-déj : un fruit, un yaourt et du pain, maintenant', 'amber', { notify: false });
  if (skipped('dej') && pm) {

      if (!meals.gouter && M.gouter.t < pm + 150) { if (pm + 150 <= M.diner.t - 75) M.gouter.t = pm + 150; else delete M.gouter; }

  Object.values(M).forEach(it => items.push(it));

  busy.forEach(a => {

    else if (a.k === 'club') add(a.f, '⚽', what || 'Sport en club', `${until} · gourde 💧 et goûter dans le sac`, 'lime', { end: a.t, kind: 'act' });

  // séance : jamais juste après un repas ni trop près du coucher ; étirements si tu fais déjà du sport.
  // Les étirements doux (light) peuvent se faire peu après un repas et jusqu'à 30 min avant le coucher.
  const blocksFor = light => busy.map(b => [b.f - 15, b.t + 15]).concat(Object.entries(M).map(([m, it]) =>
    m === 'diner' ? [it.t - 15, it.t + (light ? 40 : 90)] : [it.t, it.t + (m === 'pdj' ? 45 : m === 'gouter' || m === 'snack' ? 30 : light ? 30 : 90)]));
  const blocks = blocksFor(false);
  const sporty = busy.filter(a => (a.k === 'club' || SPORTY.test(a.what || '')) && a.t - a.f >= 45).sort((a, b) => b.t - a.t)[0];
  const done = S.workouts.some(w => w.d === key);
  let pid = WEEK[parseKey(key).getDay()], pref = (M.gouter ? M.gouter.t : 990) + 75, label = null;
  if (sporty) { pid = 'posture'; pref = sporty.t + 30; label = `Étirements après ${(sporty.what || 'ton sport').trim()}`; }
  else if (pid === 'repos') pid = null;
  const lo = Math.max(W + 60, 540, pm ? pm + 15 : 0), hi = bed - 90;
  if (pid === 'libre') {
    const c = findSlot(30, pref, lo, hi, blocks);
    if (c !== null) add(c, '⚽', 'Bouge dehors 30 min', 'Vélo, foot, basket, roller… ou l’Express 7 min si tu restes à la maison', 'cyan', { kind: 'sport', pid: 'express', done, notify: !done, end: c + 30 });
  } else if (pid) {

    let dur = estimateMin(buildSteps(pid, S.profile.lvl)), c = findSlot(dur, pref, lo, light ? bed - 30 : hi, light ? blocksFor(true) : blocks);
    if (c === null && pid !== 'express') { pid = 'express'; dur = estimateMin(buildSteps(pid, S.profile.lvl)); c = findSlot(dur, pref, lo, hi, blocks); label = 'Express 7 min (journée chargée)'; }
    if (c !== null) { const PR = PROGS[pid]; add(c, PR.e, label || PR.n, done ? 'Séance faite ✓ Bravo !' : `≈ ${dur} min · ${PR.focus}`, PR.col, { kind: 'sport', pid, done, notify: !done, end: c + dur }); }
  }

  [630, 900].forEach(t => { if (t > pm && !inBusy(t, ['school']) && !items.some(i => Math.abs(i.t - t) < 40)) add(t, '💧', 'Un grand verre d’eau', 'Ta gourde, ou deux verres d’un coup', 'cyan', { kind: 'water' }); });
  if (slept !== null && slept < 390) {

  add(bed, '🛏️', 'Au lit', `Réveil à ${fmtM(N)} demain : ${hTxt(N + 1440 - bed)} de nuit 🌙`, 'violet', { kind: 'night' });

  items.sort((a, b) => a.t - b.t);
  return { items, bed, W, N, slept, rest: !items.some(i => i.kind === 'sport') };
}

function beep(f = 880, d = 0.12, delay = 0, vol = 0.18) {

}

/* ============ confettis ============ */
const CF = { parts: [], raf: 0 };
function confetti(n = 120) {
  if (reduced()) return;
  const c = $('#confetti'), dpr = Math.min(2, window.devicePixelRatio || 1);
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const cols = ['#FF4FC1', '#3BE3FF', '#B8FF4F', '#FFB84D', '#9D7BFF', '#F4F1FF'];
  for (let i = 0; i < n; i++) {
    CF.parts.push({ x: innerWidth / 2 + (Math.random() - 0.5) * innerWidth * 0.5, y: innerHeight * 0.32, vx: (Math.random() - 0.5) * 13, vy: -Math.random() * 13 - 5, w: Math.random() * 7 + 5, h: Math.random() * 5 + 3, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length] });
  }
  if (!CF.raf) CF.raf = requestAnimationFrame(cfStep);
}
function cfStep() {
  const c = $('#confetti'), ctx = c.getContext('2d'), dpr = c.width / innerWidth;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);
  CF.parts = CF.parts.filter(p => p.y < innerHeight + 30);
  CF.parts.forEach(p => {
    p.vy += 0.32; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore();
  });
  CF.raf = CF.parts.length ? requestAnimationFrame(cfStep) : 0;
  if (!CF.raf) ctx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ============ séances ============ */
function buildSteps(pid, lvl) {
  const P = PROGS[pid], k = [0.7, 1, 1.3][lvl], kt = [0.75, 1, 1.25][lvl];
  const rounds = P.rounds ? [2, 2, 3][lvl] : 1, rest = P.rest || [40, 30, 25][lvl];
  const steps = [];
  const mk = (id, phase, round) => {
    const x = EX[id];
    let t = x.t, val;
    if (P.fast && phase === 'main') { t = 'time'; val = Math.round(40 * kt / 5) * 5; }
    else if (phase !== 'main') val = x.b;
    else if (t === 'reps') val = Math.max(4, Math.round(x.b * k));
    else val = Math.max(10, Math.round(x.b * kt / 5) * 5);
    return { k: 'ex', id, t, val, phase, round, rounds };
  };
  P.warm.forEach(id => { steps.push(mk(id, 'warm')); steps.push({ k: 'rest', s: 8, phase: 'warm' }); });
  for (let r = 1; r <= rounds; r++) {
    P.main.forEach((id, i) => {
      steps.push(mk(id, 'main', r));
      if (i < P.main.length - 1) steps.push({ k: 'rest', s: rest, phase: 'main' });
      else if (r < rounds) steps.push({ k: 'rest', s: 60, phase: 'main', big: true });
    });
  }
  if (P.cool.length) {
    steps.push({ k: 'rest', s: 10, phase: 'cool' });
    P.cool.forEach((id, i) => { steps.push(mk(id, 'cool')); if (i < P.cool.length - 1) steps.push({ k: 'rest', s: 8, phase: 'cool' }); });
  }
  return steps;
}
function estimateMin(steps) {
  const s = steps.reduce((a, st) => {
    if (st.k === 'rest') return a + st.s;
    const m = EX[st.id].side ? 2 : 1;
    return a + (st.t === 'time' ? st.val * m : st.val * 3 * m + 5);
  }, 0);
  return Math.max(1, Math.round(s / 60));
}
const tgtText = st => {
  const side = EX[st.id].side;
  return st.t === 'time' ? `${st.val} s${side ? ' / côté' : ''}` : `${st.val} ${st.val > 1 ? 'reps' : 'rep'}${side ? ' / côté' : ''}`;
};

function weightAlert() {
  if (S.weights.length < 2) return '';
  const lw = lastW();
  const ref = S.weights.slice().reverse().find(e => { const g = daysBetween(e.d, lw.d); return g >= 10 && g <= 21; });
  if (!ref) return '';
  const diff = lw.kg - ref.kg;
  if (diff > -0.8) return '';
  const gap = daysBetween(ref.d, lw.d);
  const big = diff <= -2;
  return `<div class="alert"><span>⚠️</span><div><b>Ton poids a baissé de ${fr(-diff)} kg en ${gap} jours</b>${big ? 'C’est beaucoup. Parles-en à un adulte ou à ton médecin.' : 'En pleine croissance tu dépenses beaucoup d’énergie. Ajoute un goûter costaud ou le smoothie croissance.'}</div></div>`;
}

function initRuler(box, o, onChange) {

  tr.style.setProperty('--px', o.px + 'px');

  tr.innerHTML = lab;
  const idx = v => clamp(Math.round((v - o.min) / o.step), 0, n);
  const val = i => +(o.min + i * o.step).toFixed(2);

  $$('[data-hold]', box.closest('.sheet')).forEach(b => {
    let to = null, iv = null;
    const stop = () => { clearTimeout(to); clearInterval(iv); to = iv = null; };
    b.addEventListener('pointerdown', e => { e.preventDefault(); stepBy(+b.dataset.hold); to = setTimeout(() => { iv = setInterval(() => stepBy(+b.dataset.hold), 70); }, 380); });

function tick(force) {

  const now = Date.now();

    if (r !== P.lastSec) { P.lastSec = r; const c = $('#pl-count'); if (c) { c.textContent = r; c.style.animation = 'none'; void c.offsetWidth; c.style.animation = ''; } if (!force) beep(660, 0.1); }

        const p = document.createElement('span'); p.className = 'ping'; $('#pad').appendChild(p); setTimeout(() => p.remove(), 650);
        beep(G.n % 10 === 0 ? 1175 : 740, 0.08);
        if (G.n % 10 === 0) confetti(40);
      });
    },
    end() {
      const n = G.n, rec = n > S.games.nose;
      if (rec) S.games.nose = n;
      gameShell('Nez-Pompes', `Record ${S.games.nose}`, `<div class="result"><span class="e">${rec && n ? '🏆' : '💪'}</span><b>${n} pompe${n > 1 ? 's' : ''}</b><p class="muted">${rec && n ? 'Nouveau record !' : n ? 'Bien joué. Le record t’attend.' : 'Touche la zone avec le nez à chaque pompe.'}</p></div><div class="sheet-actions"><button class="btn btn-ghost" data-act="g-close">Fermer</button><button class="btn btn-primary" data-act="g-again">Rejouer</button></div>`, 'pink');
      if (rec && n) confetti(120);
      gameXP(Math.min(30, n), 'Nez-Pompes');
    },
  },
  reflex: {
    start() {
      G.round = 0; G.times = []; G.state = 'ready';
      gameShell('Réflexe', S.games.reflex ? `Record ${S.games.reflex} ms` : '', `
        <p class="g-help">Attends que l’écran devienne vert, puis tape le plus vite possible. 5 essais.</p>
        <div class="pad" id="pad" role="button" aria-label="Zone de jeu"><span class="hint" id="pad-h">Touche pour commencer</span><small id="pad-s">Essai 1 / 5</small></div>
        <div class="dots" id="rx-dots">${'<i></i>'.repeat(5)}</div>`, 'cyan');
      $('#pad').addEventListener('pointerdown', e => { e.preventDefault(); GAMES.reflex.tap(); });
    },
    arm() {
      const pad = $('#pad'); G.state = 'wait';
      pad.className = 'pad wait'; $('#pad-h').textContent = 'Attends le vert…'; $('#pad-s').textContent = `Essai ${G.round + 1} / 5`;
      clearTimeout(G.t);
      G.t = setTimeout(() => { if (!G.on) return; G.state = 'go'; G.t0 = performance.now(); pad.className = 'pad go'; $('#pad-h').textContent = 'TAPE !'; beep(1046, 0.06); }, 1200 + Math.random() * 2300);
    },
    tap() {
      const pad = $('#pad');
      if (G.state === 'ready' || G.state === 'shown') return GAMES.reflex.arm();
      if (G.state === 'wait') {
        clearTimeout(G.t); G.state = 'shown'; pad.className = 'pad early';
        $('#pad-h').textContent = 'Trop tôt ! 😅'; $('#pad-s').textContent = 'Touche pour réessayer';
        beep(220, 0.2); return;
      }
      if (G.state === 'go') {
        const ms = Math.round(performance.now() - G.t0);
        G.times.push(ms); G.round++;
        const dots = $$('#rx-dots i'); if (dots[G.round - 1]) dots[G.round - 1].className = 'ok';
        pad.className = 'pad'; $('#pad-h').innerHTML = `<span class="num" style="font-size:54px">${ms}</span> ms`;
        $('#pad-s').textContent = G.round < 5 ? 'Touche pour l’essai suivant' : '';
        G.state = 'shown';
        if (G.round >= 5) { G.state = 'end'; setTimeout(() => { if (G.on && G.kind === 'reflex') GAMES.reflex.end(); }, 900); }
      }
    },
    end() {
      const avg = Math.round(G.times.reduce((a, b) => a + b, 0) / G.times.length), best = Math.min(...G.times);
      const rec = !S.games.reflex || avg < S.games.reflex;
      if (rec) S.games.reflex = avg;
      gameShell('Réflexe', `Record ${S.games.reflex} ms`, `<div class="result"><span class="e">${avg < 300 ? '⚡' : avg < 400 ? '😎' : '🐢'}</span><b>${avg} ms</b><p class="muted">Moyenne sur 5 essais · meilleur : ${best} ms${rec ? ' · nouveau record !' : ''}</p></div><div class="sheet-actions"><button class="btn btn-ghost" data-act="g-close">Fermer</button><button class="btn btn-primary" data-act="g-again">Rejouer</button></div>`, 'cyan');
      if (rec) confetti(100);
      gameXP(10, 'Réflexe');
    },
  },
  wheel: {
    start() {
      G.rot = G.rot || 0; G.spinning = false;
      const spins = S.games.spins[today()] || 0;
      const seg = 360 / WHEEL.length;
      let svg = '<svg class="wheel" id="wheel" viewBox="-110 -110 220 220" aria-label="Roue des défis">';
      WHEEL.forEach((w, i) => {
        const a0 = (i * seg - 90) * Math.PI / 180, a1 = ((i + 1) * seg - 90) * Math.PI / 180, am = ((i + 0.5) * seg - 90) * Math.PI / 180;
        const c = COL[WHEEL_COLS[i]];
        svg += `<path d="M0 0 L${(100 * Math.cos(a0)).toFixed(2)} ${(100 * Math.sin(a0)).toFixed(2)} A100 100 0 0 1 ${(100 * Math.cos(a1)).toFixed(2)} ${(100 * Math.sin(a1)).toFixed(2)} Z" style="fill:${i % 2 ? 'var(--surface-2)' : 'var(--surface-3)'};stroke:${c[0]};stroke-width:1.5"/>`;
        svg += `<text x="${(68 * Math.cos(am)).toFixed(2)}" y="${(68 * Math.sin(am)).toFixed(2)}" text-anchor="middle" dominant-baseline="central">${w.e}</text>`;
      });
      svg += '<circle r="100" style="fill:none;stroke:var(--text);stroke-width:3"/></svg>';
      gameShell('Roue des défis', `${spins}/3 aujourd’hui`, `
        <p class="g-help">Fais tourner la roue et relève le défi. Les 3 premiers défis de la journée rapportent de l’XP.</p>
        <div class="wheel-box"><span class="wheel-pin"></span>${svg}<span class="wheel-hub">GO</span></div>
        <div id="wheel-res"></div>
        <button class="btn btn-primary btn-block" id="spin-btn" data-act="spin">Tourner la roue</button>`, 'amber');
      $('#wheel').style.transform = `rotate(${G.rot}deg)`;
    },
    spin() {
      if (G.spinning) return;
      G.spinning = true; ensureAudio();
      const seg = 360 / WHEEL.length, i = Math.floor(Math.random() * WHEEL.length);
      const target = -(i * seg + seg / 2) + (Math.random() - 0.5) * seg * 0.6;
      const base = G.rot - (((G.rot % 360) + 360) % 360);
      G.rot = base + 360 * 6 + (((target % 360) + 360) % 360);
      $('#wheel').style.transform = `rotate(${G.rot}deg)`;
      $('#spin-btn').disabled = true; $('#wheel-res').innerHTML = '';
      const ticks = setInterval(() => beep(500 + Math.random() * 200, 0.03, 0, 0.08), 160);
      G.t = setTimeout(() => {
        clearInterval(ticks);
        if (!G.on) return;
        G.spinning = false; G.pick = i; beep(988, 0.2);
        const w = WHEEL[i], spins = S.games.spins[today()] || 0;
        $('#wheel-res').innerHTML = `<div class="result"><span class="e">${w.e}</span><b>${w.t}</b><p class="muted">${spins < 3 ? 'Fais-le maintenant, puis valide.' : 'Plus d’XP pour aujourd’hui, mais tu peux le faire pour le plaisir.'}</p><button class="btn btn-primary btn-block" data-act="wheel-ok">${ICON.check} Défi réussi${spins < 3 ? ' · +15 XP' : ''}</button></div>`;
        $('#spin-btn').disabled = false; $('#spin-btn').textContent = 'Relancer'; $('#spin-btn').className = 'btn btn-ghost btn-block';
      }, 4500);
    },
    ok() {
      const t = today(), spins = S.games.spins[t] || 0;
      const keep = {}; keep[t] = spins + 1; S.games.spins = keep;
      confetti(80);
      $('#wheel-res').innerHTML = '';
      $('.g-top .rec').textContent = `${spins + 1}/3 aujourd’hui`;
      gameXP(spins < 3 ? 15 : 0, 'Défi réussi');
      if (spins >= 3) toast('Bravo 💪');
    },
  },
  quiz: {
    start() {
      G.qs = shuffle(QUIZ).slice(0, 6); G.qi = 0; G.score = 0; G.res = []; G.answered = false;
      GAMES.quiz.show();
    },
    show() {
      const q = G.qs[G.qi];
      const dots = G.qs.map((_, j) => `<i class="${G.res[j] === true ? 'ok' : G.res[j] === false ? 'ko' : j === G.qi ? 'cur' : ''}"></i>`).join('');
      gameShell('Vrai ou faux ?', S.games.quiz ? `Record ${S.games.quiz}/6` : '', `
        <div class="dots">${dots}</div>
        <div class="qcard" id="qcard"><p class="eyebrow">Question ${G.qi + 1} / ${G.qs.length}</p><p class="q">${q[0]}</p><div id="qfb"></div></div>
        <div class="vf" id="vf"><button class="btn v" data-act="qa" data-arg="1">Vrai</button><button class="btn f" data-act="qa" data-arg="0">Faux</button></div>`, 'violet');
    },
    answer(v) {
      if (G.answered) return;
      G.answered = true;
      const q = G.qs[G.qi], ok = (v === '1') === q[1];
      G.res[G.qi] = ok; if (ok) G.score++;
      const card = $('#qcard'); card.classList.add(ok ? 'ok' : 'ko');
      $('#qfb').innerHTML = `<p class="verdict" style="color:${ok ? 'var(--good)' : 'var(--bad)'}">${ok ? 'Bonne réponse !' : 'Raté !'}</p><p class="exp">${q[2]}</p>`;
      beep(ok ? 880 : 220, 0.15);
      $('#vf').innerHTML = `<button class="btn btn-primary" style="grid-column:1/-1" data-act="qnext">${G.qi < G.qs.length - 1 ? 'Question suivante' : 'Voir mon score'}</button>`;
    },
    next() {
      G.answered = false;
      if (G.qi < G.qs.length - 1) { G.qi++; return GAMES.quiz.show(); }
      const sc = G.score, rec = sc > S.games.quiz;
      if (rec) S.games.quiz = sc;
      gameShell('Vrai ou faux ?', `Record ${S.games.quiz}/6`, `<div class="result"><span class="e">${sc === 6 ? '🧠' : sc >= 4 ? '😎' : '📚'}</span><b>${sc} / 6</b><p class="muted">${sc === 6 ? 'Sans faute ! Tu sais tout sur la croissance.' : sc >= 4 ? 'Très bien, tu connais les bases.' : 'Rejoue pour apprendre les bons réflexes.'}</p></div><div class="sheet-actions"><button class="btn btn-ghost" data-act="g-close">Fermer</button><button class="btn btn-primary" data-act="g-again">Rejouer</button></div>`, 'violet');
      if (sc >= 5) confetti(110);
      gameXP(sc * 5, 'Quiz');
    },
  },
};

/* ============ actions ============ */
const ACT = {
  tab(a) { if (UI.tab === a) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; } UI.tab = a; UI.pendingDel = null; render(true); window.scrollTo(0, 0); },
  settings() { UI.confirmReset = false; openSheet(settingsHTML(), { kind: 'settings' }); },
  habit(id) {
    const t = today(), list = S.habits[t] = S.habits[t] || [];
    const i = list.indexOf(id);
    if (i >= 0) { list.splice(i, 1); S.xp = Math.max(0, S.xp - 5); }
    else { list.push(id); UI.popHabit = id; addXP(5, HABITS.find(h => h.id === id).n); if (list.length === HABITS.length) { confetti(120); } }
    checkBadges(); persist(); render();
  },
  water(a) {
    const t = today(), i = +a, cur = S.water[t] || 0;
    S.water[t] = cur === i + 1 ? i : i + 1;
    if (S.water[t] >= 8 && !S.flags['w' + t]) { S.flags['w' + t] = 1; addXP(10, 'Objectif eau atteint 💧'); confetti(60); }
    checkBadges(); persist(); render();
  },
  prog(a) { openProg(a); },
  go(a) { startWorkout(a); },
  lvl(a, el) {
    S.profile.lvl = +a; persist();
    const seg = el.closest('.seg');
    seg.style.setProperty('--k', a);
    $$('button', seg).forEach((b, i) => b.classList.toggle('on', i === +a));
    $('.seg-help').textContent = LVL_HELP[+a];
    setTimeout(render, 420);
  },
  zone(a) { UI.zone = a; render(); },
  ex(a) { openEx(a); },
  rcat(a) { UI.rcat = a; render(); },
  rcp(a) { openRecipe(a); },
  game(a) { openGame(a); },
  weigh() { openWeigh(false); },
  height() { openHeight(false); },
  'w-save'() { saveWeigh(); },
  'w-skip'() { S.asked.w = today(); persist(); closeSheet(); },
  'h-save'() { saveHeight(); },
  'h-later'() { closeSheet(); },
  plan() { openPlan(); },
  'bj-open'() { openBonjour(false); },
  'bj-later'() { S.asked.b = today(); persist(); closeSheet(); },
  'bj-next'() { if (bjValid()) bjShow(BJ.step + 1, 'fwd'); },
  'bj-back'() { bjShow(BJ.step - 1, 'back'); },
  'bj-calc'() { if (bjValid()) saveBonjour(); },
  'bj-done'() { closeSheet(); confetti(70); },
  'bj-add'(k) {
    const T = ACT_TYPES[k], a = { k };
    if (k === 'food') { const n = nowMin(); a.meal = n < 600 ? 'dej' : n < 900 ? 'gouter' : 'diner'; a.from = MEALS[a.meal][1]; a.place = ''; }
    else { a.from = T.from; a.to = k === 'school' && new Date().getDay() === 3 ? '12:00' : T.to; a.what = ''; }
    BJ.d.acts.push(a); bjRefresh();
    const cards = $$('#bj .act'); if (cards.length) cards[cards.length - 1].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  },
  'bj-del'(i) { BJ.d.acts.splice(+i, 1); bjRefresh(); },
  'bj-meal'(arg) { const [i, m] = arg.split('|'), a = BJ.d.acts[+i]; a.meal = m; a.from = MEALS[m][1]; bjRefresh(); },
  'bj-pick'(arg) { const [i, f, v] = arg.split('|'); BJ.d.acts[+i][f] = v; bjRefresh(); },
  'bj-mst'(arg) { const [m, s] = arg.split('|'), L = BJ.d.meals[m] = BJ.d.meals[m] || {}; L.s = s; if (s === 'skip') L.items = []; bjRefresh(); },
  'bj-mplace'(arg) { const [m, p] = arg.split('|'); BJ.d.meals[m].place = p; bjRefresh(); },
  'bj-mitem'(arg) {
    const [m, p] = arg.split('|'), L = BJ.d.meals[m], list = L.items = L.items || [], i = list.indexOf(p);
    if (i >= 0) list.splice(i, 1); else list.push(p);
    bjRefresh();
  },
  'notif-on'() { enableNotifs(); },
  'notif-later'() { NOTIF.later = today(); saveNotif(); refreshNotifUI(); },
  'notif-toggle'(_, el) { el.classList.toggle('on'); if (notifMode() === 'on') disableNotifs(); else enableNotifs(); },
  range(a) { UI.wRange = +a; render(); },
  histall() { UI.histAll = !UI.histAll; render(); },
  del(a) {
    if (UI.pendingDel !== a) { UI.pendingDel = a; render(); return; }
    S.weights = S.weights.filter(e => e.d !== a); S.heights = S.heights.filter(e => e.d !== a);
    UI.pendingDel = null; persist(); render(); toast('Mesure effacée');
  },
  badge(a) { const b = BADGES.find(x => x.id === a); toast(`${b.e} ${b.n}`, S.badges[a] ? `Débloqué le ${fmtDate(S.badges[a])}` : b.d); },
  estsex(a) { S.profile.par.sex = a; persist(); render(); },
  scrim() { if (SHEET && !SHEET.opts.locked) closeSheet(); },
  'close-sheet'() { closeSheet(); },
  'welcome-go'() { saveWelcome(); },
  sound(_, el) { S.profile.sound = !S.profile.sound; el.classList.toggle('on', S.profile.sound); el.setAttribute('aria-pressed', S.profile.sound); persist(); if (S.profile.sound) { ensureAudio(); beep(880, 0.1); } },
  'set-save'() {
    const n = $('#set-name').value.trim().slice(0, 20), b = $('#set-birth').value;
    S.profile.name = n;
    if (/^\d{4}-\d{2}-\d{2}$/.test(b) && b < today()) S.profile.birth = b;
    persist(); closeSheet(); render(); toast('Profil enregistré');
  },
  copy() {
    const txt = JSON.stringify(S);
    const fallback = () => { const box = $('#copy-box'); box.hidden = false; const ta = $('#copy-txt'); ta.value = txt; ta.focus(); ta.select(); };
    try {
      navigator.clipboard.writeText(txt).then(() => toast('Données copiées', 'Garde-les dans tes notes')).catch(fallback);
    } catch (e) { fallback(); }
  },
  'imp-open'() { const b = $('#imp'); b.hidden = !b.hidden; },
  import() {
    let o = null;
    try { o = JSON.parse($('#imp-txt').value); } catch (e) { o = null; }
    if (!o || typeof o !== 'object' || !Array.isArray(o.weights) || !o.profile) return toast('Ce texte ne ressemble pas à une sauvegarde LVL UP');
    S = migrate(o); S.onboarded = true; persist(); closeSheet(); render(true); toast('Données importées ✓');
  },
  reset() {
    if (!UI.confirmReset) { UI.confirmReset = true; $('[data-act="reset"]').textContent = 'Touche encore pour confirmer'; return; }
    UI.confirmReset = false;
    S = defaultState(); persist(); closeSheet(true); render(true); setTimeout(runPrompts, 400);
  },
  'pl-quit'() { P.modal = 'quit'; renderPlayer(); },
  'pl-pain'() { P.modal = 'pain'; renderPlayer(); },
  'pl-stay'() { P.modal = null; renderPlayer(); },
  'pl-exit'() { P.levelUp = null; closePlayer(); },
  'pl-painskip'() { P.modal = null; next(); },
  'pl-skip'() { if (P.mode === 'count') { P.endAt = Date.now(); } else next(); },
  'pl-pause'() { P.paused = !P.paused; renderPlayer(); },
  'pl-plus'() { P.endAt += 15000; P.total += 15000; },
  'pl-sound'() { S.profile.sound = !S.profile.sound; persist(); ensureAudio(); renderPlayer(); },
  'pl-close'() { closePlayer(); },
  'g-close'() { closeGame(); },
  'g-again'() { GAMES[G.kind].start(); },
  'nose-end'() { GAMES.nose.end(); },
  spin() { GAMES.wheel.spin(); },
  'wheel-ok'() { GAMES.wheel.ok(); },
  qa(a) { GAMES.quiz.answer(a); },
  qnext() { GAMES.quiz.next(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset.arg, el, e);
});
document.addEventListener('input', e => {
  const bj = e.target.dataset && e.target.dataset.bj;
  if (bj && BJ.d) {
    const [k, i, f] = bj.split('.'), v = e.target.value.slice(0, 30);
    if (k === 'acts') {
      BJ.d.acts[+i][f] = v;
      $$(`#bj [data-act="bj-pick"][data-arg^="${i}|${f}|"]`).forEach(c => c.classList.toggle('on', c.dataset.arg.split('|')[2] === v));
    } else if (k === 'meals') {
      BJ.d.meals[i][f] = v;
      $$(`#bj [data-act="bj-mplace"][data-arg^="${i}|"]`).forEach(c => c.classList.toggle('on', c.dataset.arg.split('|')[1] === v));
    } else {
      BJ.d[k] = v;
      const box = $('#bj-sleep');
      if (box && (k === 'wake' || k === 'sleep')) box.innerHTML = sleepCardHTML();
    }
    return;
  }
  if (e.target.id === 'est-f' || e.target.id === 'est-m') {
    S.profile.par[e.target.id === 'est-f' ? 'f' : 'm'] = e.target.value.slice(0, 6);
    $('#est-r').innerHTML = estResult();
    clearTimeout(estT); estT = setTimeout(persist, 700);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SHEET && !SHEET.opts.locked) closeSheet(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (P.on && P.mode !== 'done') requestWake();
  if (lastRenderDay !== today() && !P.on && !G.on) render();
  remTick();
  if (NOTIF.synced !== today()) syncReminders();
  refreshRemote().finally(() => setTimeout(runPrompts, 300));
});

/* ============ icône écran d'accueil (iPhone) ============ */
function touchIcon() {
  if (document.querySelector('link[rel="apple-touch-icon"]')) return;
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    const bg = x.createLinearGradient(0, 0, 180, 180); bg.addColorStop(0, '#1C1733'); bg.addColorStop(1, '#100D1F');
    x.fillStyle = bg; x.fillRect(0, 0, 180, 180);
    const g = x.createLinearGradient(30, 0, 150, 0); g.addColorStop(0, '#FF4FC1'); g.addColorStop(0.5, '#9D7BFF'); g.addColorStop(1, '#3BE3FF');
    x.strokeStyle = g; x.lineWidth = 7; x.lineCap = 'round';
    x.beginPath(); x.moveTo(90, 132); x.lineTo(90, 52); x.moveTo(62, 78); x.lineTo(90, 50); x.lineTo(118, 78); x.stroke();
    x.fillStyle = '#F4F1FF'; x.font = '800 30px system-ui, sans-serif'; x.textAlign = 'center'; x.fillText('LVL UP', 90, 160);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
  } catch (e) { /* pas d'icône */ }
}

/* ============ démarrage ============ */
render(true);
touchIcon();
setInterval(remTick, 20000);
if (NOTIF.synced !== today()) syncReminders();
Promise.race([initRemote(), new Promise(r => setTimeout(r, 2500))]).then(() => setTimeout(runPrompts, 350));
})();
</script>
